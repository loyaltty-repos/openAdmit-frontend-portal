name: Deploy Dev - OpenAdmit Portal

on:
  push:
    branches:
      - portal_dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/loyaltty-repos/openadmit-portal:dev .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/loyaltty-repos/openadmit-portal:dev

      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: root
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/loyaltty-repos/openadmit-portal:dev

            docker stop openadmit-portal-dev || true
            docker rm openadmit-portal-dev || true

            docker run -d \
              --name openadmit-portal-dev \
              --restart always \
              -p 3001:80 \
              ghcr.io/loyaltty-repos/openadmit-portal:dev
