name: Deploy Dev - OpenAdmit Portal

on:
  push:
    branches:
      - portal_dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile # ← change only if your Dockerfile is named differently
          push: true
          tags: ghcr.io/loyaltty-repos/openadmit-portal:dev
          build-args: |
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
            VITE_HOME_PATH=${{ secrets.VITE_HOME_PATH }}
            VITE_CASHFREE_MODE=${{ secrets.VITE_CASHFREE_MODE }}
            VITE_PUBLIC_FIREBASE_API_KEY=${{ secrets.VITE_PUBLIC_FIREBASE_API_KEY }}
            VITE_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            VITE_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.VITE_PUBLIC_FIREBASE_PROJECT_ID }}
            VITE_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            VITE_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_PUBLIC_FIREBASE_APP_ID=${{ secrets.VITE_PUBLIC_FIREBASE_APP_ID }}
            VITE_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: root
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/loyaltty-repos/openadmit-portal:dev

            docker stop openadmit-portal-dev || true
            docker rm openadmit-portal-dev || true

            docker run -d \
              --name openadmit-portal-dev \
              --restart always \
              -p 3001:80 \
              ghcr.io/loyaltty-repos/openadmit-portal:dev
